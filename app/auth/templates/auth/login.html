{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-5">
        <div class="card-modern p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1 class="h4 fw-bold text-slate-900 mb-1">Welcome Back</h1>
                <p class="text-secondary small mb-0">Sign in to track, mentor, and benchmark employability readiness</p>
            </div>

            <form method="post" action="{{ url_for('auth.login') }}" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">
                        Email Address <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input id="email" name="email" type="email" class="form-control border-start-0" placeholder="name@college.edu" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">
                            Password <span class="text-danger">*</span>
                        </label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input id="password" name="password" type="password" class="form-control border-start-0 border-end-0" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
                        <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-4 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In to Account
                </button>
            </form>

            <!-- Quick Demo Credentials for Fast Evaluation -->
            <div class="pt-3 border-top">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span class="small fw-semibold text-secondary text-uppercase" style="font-size: 0.725rem; letter-spacing: 0.05em;">
                        <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins
                    </span>
                    <span class="badge bg-light text-muted border small">Click to autofill</span>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100 text-start py-2 px-2 demo-btn" 
                                data-email="student@example.com" data-pass="student123">
                            <div class="fw-semibold small text-slate-800"><i class="bi bi-mortarboard text-primary me-1"></i> Student</div>
                            <div class="text-muted" style="font-size: 0.7rem;">student@example.com</div>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100 text-start py-2 px-2 demo-btn" 
                                data-email="mentor@example.com" data-pass="mentor123">
                            <div class="fw-semibold small text-slate-800"><i class="bi bi-person-check text-purple me-1"></i> Mentor</div>
                            <div class="text-muted" style="font-size: 0.7rem;">mentor@example.com</div>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100 text-start py-2 px-2 demo-btn" 
                                data-email="tpo@example.com" data-pass="tpo123">
                            <div class="fw-semibold small text-slate-800"><i class="bi bi-building text-success me-1"></i> TPO</div>
                            <div class="text-muted" style="font-size: 0.7rem;">tpo@example.com</div>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100 text-start py-2 px-2 demo-btn" 
                                data-email="admin@example.com" data-pass="admin123">
                            <div class="fw-semibold small text-slate-800"><i class="bi bi-shield-lock text-danger me-1"></i> Admin</div>
                            <div class="text-muted" style="font-size: 0.7rem;">admin@example.com</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    // Quick Demo autofill
    const demoBtns = document.querySelectorAll('.demo-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    demoBtns.forEach(btn => {
        btn.addEventListener('click', function () {
            emailInput.value = this.getAttribute('data-email');
            passwordInput.value = this.getAttribute('data-pass');
            emailInput.focus();
        });
    });

    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }
});
</script>
{% endblock %}
