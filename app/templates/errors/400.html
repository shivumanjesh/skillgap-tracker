{% extends "base.html" %}

{% block title %}400 - Invalid Request{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card-modern p-5">
            <div class="empty-state-icon text-warning mx-auto">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h1 class="h3 fw-bold text-slate-900 mb-2">Invalid Request</h1>
            <p class="text-secondary mb-4">
                The server could not process your submission due to invalid or malformed data.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
