{% extends "base.html" %}

{% block title %}Academic Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 fw-bold text-slate-900 mb-1">Academic Profile</h1>
                <p class="text-secondary small mb-0">Update your college department and current academic year</p>
            </div>
            <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('student.dashboard') }}">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>

        <div class="card-modern p-4">
            <form method="post" action="{{ url_for('student.profile') }}">
                <div class="mb-3">
                    <label class="form-label" for="branch">
                        Branch / Department <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="branch" name="branch" required>
                        <option value="">Select your engineering branch</option>
                        {% set branches = [
                            "Computer Science & Engineering",
                            "Information Science & Engineering",
                            "Artificial Intelligence & Machine Learning",
                            "Electronics & Communication Engineering",
                            "Electrical & Electronics Engineering",
                            "Mechanical Engineering",
                            "Civil Engineering"
                        ] %}
                        {% for b in branches %}
                            <option value="{{ b }}" {% if profile.branch == b %}selected{% endif %}>{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="year">
                        Current Academic Year <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="year" name="year" required>
                        <option value="">Select year of study</option>
                        <option value="1" {% if profile.year == 1 %}selected{% endif %}>1st Year (Freshman)</option>
                        <option value="2" {% if profile.year == 2 %}selected{% endif %}>2nd Year (Sophomore)</option>
                        <option value="3" {% if profile.year == 3 %}selected{% endif %}>3rd Year (Junior)</option>
                        <option value="4" {% if profile.year == 4 %}selected{% endif %}>4th Year (Senior / Placement Ready)</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
                        <i class="bi bi-check-lg"></i> Save Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
